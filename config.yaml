model:
  type: "metmap"       # "metmap", "sigma"
  n_features: null     # null = all 2086 metabolites; an integer keeps the top-n by mean intensity
  hidden_dim: 120
  n_isodepth: 3

training:
  epochs: 3000
  learning_rate: 0.001
  lasso_lambda: 0.0001
  lr_end_factor: 0.05   # LinearLR decays lr to 5% over lr_total_iters
  lr_total_iters: 12000
  seed: 0

data:
  filepath: "data/BC_515_Section_1.h5ad"

evaluation:
  test_fraction: 0.2          # random splits: fraction of spots held out
  n_random_repeats: 5         # independent random 80/20 splits
  n_spatial_folds: 5          # k-means blocks on (x, y); each block is held out once
  interface_neighbors: 6      # Tumor/Stroma spot is "Interface" if one of its k nearest spots has the other label
  min_fold_fraction: 0.5      # warn if a region has < this fraction of its even-split count in any fold
